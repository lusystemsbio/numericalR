<script>
// Robust right-side TOC scrollspy.
// Quarto's built-in active-highlighting was not updating on this book (the
// .active class stayed stuck on the first entry). This mirrors Quarto's logic
// but computes each section's absolute document position with
// getBoundingClientRect() (rather than offsetTop, which is relative to the
// offsetParent and can be wrong), and it registers after quarto.js so it wins
// the scroll handler. HTML-only; ignored by PDF/EPUB.
(function () {
  function initTocSpy() {
    var toc = document.querySelector('nav#TOC[role="doc-toc"]') ||
              document.querySelector('nav[role="doc-toc"].toc-active');
    if (!toc) return;

    var links = Array.prototype.slice.call(
      toc.querySelectorAll('a[data-scroll-target], a[href^="#"]')
    );
    var entries = links.map(function (a) {
      var id = (a.getAttribute('data-scroll-target') || a.getAttribute('href') || '')
                 .replace(/^#/, '');
      var sec = id ? document.getElementById(decodeURIComponent(id)) : null;
      return { link: a, section: sec };
    }).filter(function (e) { return e.section; });
    if (!entries.length) return;

    var MARGIN = 200;
    function absTop(el) {
      return el.getBoundingClientRect().top + (window.scrollY || window.pageYOffset);
    }
    function update() {
      var y = window.scrollY || window.pageYOffset;
      var idx = 0;
      for (var i = 0; i < entries.length; i++) {
        if (absTop(entries[i].section) - MARGIN <= y) idx = i;
      }
      // at the very bottom, the last section should be active
      if (window.innerHeight + y >= document.body.offsetHeight - 2) {
        idx = entries.length - 1;
      }
      for (var j = 0; j < entries.length; j++) {
        entries[j].link.classList.toggle('active', j === idx);
      }
    }

    var ticking = false;
    function onScroll() {
      if (!ticking) {
        window.requestAnimationFrame(function () { update(); ticking = false; });
        ticking = true;
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', update);
    update();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTocSpy);
  } else {
    initTocSpy();
  }
})();
</script>
