<!-- HTML-only R/Python implementation switch.
     Injected via `format: html: include-after-body`, so it never reaches PDF/EPUB
     (which keep both languages, per the no-tabsets convention). On load it tags each
     `### R/Python implementation {.impl}` heading and its code cells, then a small
     "Both / R / Python" control hides the non-selected language's CODE only. Prose
     (shared concept text, shared post-Python discussion) is never tagged, so it stays
     visible in every mode. The choice persists across chapters via localStorage. The
     switch appears on any genuinely dual-language page (both languages present),
     including exercises pages that carry paired implementations (1D, 2G); pages with
     no `.impl` headings, or only one language, get no switch. Single-language SOURCE
     copies for practice are a separate, local mechanism (scripts/make-lang-variants.py
     writes them beside each chapter's .qmd), not a web download. -->
<style>
.lang-switch {
  display: inline-flex; margin: 0.25rem 0 1.25rem 0;
  border: 1px solid #d0d0d0; border-radius: 6px; overflow: hidden;
  font-size: 0.8rem; user-select: none;
}
.lang-switch button {
  border: none; border-right: 1px solid #d0d0d0; background: #fff;
  padding: 4px 14px; cursor: pointer; color: #444; line-height: 1.4;
}
.lang-switch button:last-child { border-right: none; }
.lang-switch button:hover { background: #f2f6fb; }
.lang-switch button.active { background: #2780e3; color: #fff; }
/* hide the non-selected implementation (heading + code cells only) */
body.lang-r  .impl-py { display: none !important; }
body.lang-py .impl-r  { display: none !important; }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var heads = document.querySelectorAll("h3.impl");
  if (!heads.length) return;   // no R/Python implementation blocks -> no switch

  // 1. tag each implementation heading + its code cells with impl-r / impl-py
  var hasR = false, hasPy = false;
  heads.forEach(function (h) {
    var id = (h.getAttribute("data-anchor-id") || h.textContent).toLowerCase();
    var cls = id.indexOf("python") >= 0 ? "impl-py"
            : id.indexOf("r-implementation") >= 0 || id.indexOf("r implementation") >= 0 ? "impl-r"
            : null;
    if (!cls) return;
    if (cls === "impl-r") hasR = true; else hasPy = true;
    h.classList.add(cls);
    var el = h.nextElementSibling;
    while (el && !/^H[1-4]$/.test(el.tagName)) {          // stop at the next heading
      var isCode = el.matches("div.cell, div.sourceCode") || el.tagName === "PRE"
                   || (el.querySelector && el.querySelector("div.sourceCode, pre.sourceCode"));
      if (isCode) el.classList.add(cls);                  // tag code only, never prose
      el = el.nextElementSibling;
    }
  });

  if (!hasR || !hasPy) return;   // switch only on genuinely dual-language pages

  // 2. build the Both / R / Python switch
  var bar = document.createElement("div");
  bar.className = "lang-switch";
  bar.setAttribute("aria-label", "Show R or Python implementation");
  ["Both", "R", "Python"].forEach(function (lab) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = lab;
    b.addEventListener("click", function () { setLang(lab); });
    bar.appendChild(b);
  });

  var title = document.getElementById("title-block-header");
  if (title) title.insertAdjacentElement("afterend", bar);
  else {
    var main = document.querySelector("main") || document.body;
    main.insertBefore(bar, main.firstChild);
  }

  function setLang(lab) {
    document.body.classList.remove("lang-r", "lang-py", "lang-both");
    document.body.classList.add(lab === "R" ? "lang-r" : lab === "Python" ? "lang-py" : "lang-both");
    bar.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b.textContent === lab);
    });
    try { localStorage.setItem("impl-lang", lab); } catch (e) {}
  }

  var saved = "Both";
  try { saved = localStorage.getItem("impl-lang") || "Both"; } catch (e) {}
  setLang(saved);
});
</script>
