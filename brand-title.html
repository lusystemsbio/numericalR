<!-- Colour the R and Py in the displayed book title ("Numerical ReciPy").

     Done in the DOM, not via a Pandoc span in `book: title:`, because Quarto
     builds each chapter page's <title> element by concatenating the RAW title
     string without processing markup, so a span there leaks visibly into every
     browser tab. Only exact matches of the plain title are rewritten, so
     nothing else on the page is touched. The preface's in-body mention of the
     title still uses a Pandoc span, which renders correctly in all formats. -->
<script>
  window.document.addEventListener("DOMContentLoaded", function () {
    const TITLE = "Numerical ReciPy";
    const HTML  = 'Numerical <span class="brand-r">R</span>eci' +
                  '<span class="brand-py">Py</span>';
    document.querySelectorAll(
      ".sidebar-title a, .sidebar-title, h1.title, .navbar-title"
    ).forEach(function (el) {
      if (el.textContent.trim() === TITLE) { el.innerHTML = HTML; }
    });
  });
</script>
