project:
  type: book
  execute-dir: project
  pre-render: scripts/build-fortran.sh

# Cache each chapter's executed R/Python output under _freeze/. `quarto render`
# then re-runs only chapters whose source changed and loads the rest from cache,
# so a whole-book build stays fast and consistent. Delete _freeze/<chapter> (or
# edit the .qmd) to force a re-run, e.g. after a package/data change.
execute:
  freeze: auto

book:
  title: "Numerical RPy"
  subtitle: "In the Era of AI"
  output-file: "NumericalRPy"   # base name for the PDF/EPUB downloads
  # Fold the left nav: parts collapsed by default, only the current part
  # expands to show its chapters (keeps the sidebar short as chapters grow).
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Part 1: Introduction to R and Python programming"
      chapters:
        - 01-tools/01a-getting-started.qmd
    - part: "Part 2: Ordinary differential equations"
      chapters:
        - 02-odes/02a-modeling-gene-circuits.qmd
        - 02-odes/02b-numerical-integration.qmd
        - 02-odes/02c-bacterial-growth.qmd
        - 02-odes/02d-effective-potential.qmd
        - 02-odes/02e-bifurcation.qmd
        - 02-odes/02f-bifurcation-curves.qmd
        - 02-odes/02g-exercises.qmd
    - part: "Part 3: Phase plane"
      chapters:
        - 03-phase-plane/03a-nullclines.qmd
        - 03-phase-plane/03b-steady-states-2d.qmd
        - 03-phase-plane/03c-chemostat.qmd
        - 03-phase-plane/03d-predator-prey.qmd
        - 03-phase-plane/03e-bifurcation-2d.qmd
        - 03-phase-plane/03f-separatrix.qmd
        - 03-phase-plane/03g-effective-potential-2d.qmd
        - 03-phase-plane/03h-multi-component.qmd
        - 03-phase-plane/03i-exercises.qmd
    - part: "Part 4: Systems with time delays"
      chapters:
        - 04-time-delays/04a-delayed-differential-equations.qmd
        - 04-time-delays/04b-modeling-time-delays.qmd
        - 04-time-delays/04c-indirect-interactions.qmd
        - 04-time-delays/04d-exercises.qmd
    - part: "Part 5: Molecular dynamics"
      chapters:
        - 05-molecular-dynamics/05a-second-order-integrators.qmd
        - 05-molecular-dynamics/05b-orbital-motion.qmd
        - 05-molecular-dynamics/05c-box-of-particles.qmd
        - 05-molecular-dynamics/05d-exercises.qmd
    - part: "Part 6: Stochastic differential equations"
      chapters:
        - 06-stochastic/06a-random-number-generators.qmd
        - 06-stochastic/06b-brownian-motion.qmd
        - 06-stochastic/06c-sde-integrators.qmd
        - 06-stochastic/06d-stochastic-transitions.qmd
        - 06-stochastic/06e-exercises.qmd
    - part: "Part 7: Partial differential equations"
      chapters:
        - 07-pde/07a-modeling-diffusion.qmd
        - 07-pde/07b-reaction-diffusion.qmd
        - 07-pde/07c-turing-instability.qmd
        - 07-pde/07d-pattern-formation-dictyostelium.qmd
        - 07-pde/07e-2d-reaction-diffusion.qmd
    - references.qmd

bibliography: references.bib

# Auto-trim whitespace around every figure (knitr runs ImageMagick `convert -trim`
# on each PNG). Matplotlib already crops via savefig.bbox=tight; this mainly tightens
# the R base plots, which reserve a wide top margin for an absent title.
knitr:
  opts_chunk:
    crop: true
    rmar: true            # trim R base plots' reserved top-title margin (see .Rprofile)
    fig.align: center     # center generated plots in every format
    fig.width: 7          # generation size (natural 7:5 aspect); square plots override
    fig.height: 5         #   per-chunk with fig-width/height: 5
    out.width: "55%"      # display width (0.70\linewidth in PDF); fonts/aspect preserved

# Chapters are labelled 2A/2B/... by their titles and sections are numbered
# 2A.1/2A.2/... by hand, so Quarto's automatic numbering is turned off.
number-sections: false

# Center all figures (generated plots + images) in every format: HTML, PDF, EPUB.
fig-align: center

filters:
  - impl-box.lua
  - epub-tag.lua   # EPUB only: rewrite \tag{N} -> \qquad (N) so texmath renders it

format:
  html:
    theme: cosmo
    css: styles.css
    include-after-body: toc-active.html   # robust right-TOC scrollspy (see file)
    toc-depth: 2      # right TOC lists only the numbered sections (2B.1, 2B.2, ...)
    toc-expand: true  # keep the TOC list expanded (don't collapse/hide it)
  pdf:
    documentclass: scrreprt
    geometry:
      - margin=1in          # tighter than KOMA's wide default -> more text per page
    fig-width: 7            # generate at full size (natural 7:5 aspect, fonts proportional)
    fig-height: 5           # display is scaled down by \setkeys below (aspect preserved)
    toc-depth: 2
    include-in-header:
      text: |
        \usepackage{xcolor}
        \newcommand{\impllabel}[1]{\par\smallskip\noindent\colorbox{blue!7}{\parbox{\dimexpr\linewidth-2\fboxsep\relax}{\strut\textbf{#1}}}\par\smallskip}
        % wrap long code lines so they never overflow the page (code-overflow: wrap
        % alone did not take effect; force it on the highlighting Verbatim env)
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,breakanywhere,fontsize=\small,commandchars=\\\{\}}
        % --- fill pages better: compress heading whitespace ---
        \renewcommand*{\chapterheadstartvskip}{\vspace*{.5\baselineskip}}
        \renewcommand*{\chapterheadendvskip}{\vspace*{.8\baselineskip}}
        \RedeclareSectionCommand[beforeskip=-.5\baselineskip, afterskip=.35\baselineskip]{section}
        \RedeclareSectionCommand[beforeskip=-.4\baselineskip, afterskip=.25\baselineskip]{subsection}
  epub:
    toc-depth: 2
    css: styles.css
