<!-- HTML-only: add a "Copy prompt" button to each Recipe card. It assembles a
     ready-to-paste, context-free prompt from the card's four plain-text fields
     (Objective / Method / Test / Verification) wrapped in the standard template,
     and copies it to the clipboard. Registered under format: html include-after-body,
     so PDF/EPUB are unaffected. Cards are written in plain text (no typeset math,
     no cross-references), so the copied prompt is clean and self-contained. -->
<style>
.recipe-copy-btn {
  margin-left: auto; border: 1px solid #cfd8e3; background: #fff; color: #2780e3;
  border-radius: 5px; cursor: pointer; font-size: 0.72rem; line-height: 1.4;
  padding: 1px 9px; white-space: nowrap;
}
.recipe-copy-btn:hover { background: #f2f6fb; }
/* Plain code blocks (AI-session transcripts, prompts) are not .sourceCode, so they
   render at the default font, whose ~72-character authored lines overflow the content
   column. Match the code-block font (0.85em) so those lines fit as written, without
   re-wrapping or spilling out. HTML-only (recipe-copy.html is an html
   include-after-body), so EPUB keeps its fixed-width ASCII mockups intact. */
pre:not(.sourceCode), pre:not(.sourceCode) > code {
  font-size: 0.85em; white-space: pre-wrap;
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll('.callout[title^="Recipe"]').forEach(function (card) {
    var header = card.querySelector(".callout-header");
    var body = card.querySelector(".callout-body");
    if (!header || !body) return;

    // pull the four fields out of the body paragraphs
    var f = {};
    body.querySelectorAll("p").forEach(function (p) {
      var m = p.textContent.match(/^\s*(Objective|Model|Method|Test|Verification)\.\s*([\s\S]*)$/);
      if (m) f[m[1]] = m[2].trim().replace(/\s+/g, " ");
    });
    if (!f.Objective) return;

    // fill the 1A.2 prompt template with the card fields: drop each field's
    // trailing period so the template's own punctuation reads cleanly, and
    // lower-case the fields that slot mid-sentence.
    var frag = function (s) { return (s || "").trim().replace(/\.$/, ""); };
    var lc = function (s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; };

    var prompt =
      "In R (or Python), " + lc(frag(f.Objective)) + ". " +
      (f.Model ? "The model is " + lc(frag(f.Model)) + ". " : "") +
      "Use " + lc(frag(f.Method)) + ". " +
      "Test it on " + frag(f.Test) + ", and include the verification I can run: " +
      frag(f.Verification) + ". " +
      "Implement the method explicitly with short comments rather than calling a " +
      "routine that does it in one step, and explain in one sentence why the " +
      "verification confirms the result.";

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "recipe-copy-btn";
    btn.textContent = "Copy prompt";
    btn.addEventListener("click", function () {
      navigator.clipboard.writeText(prompt).then(function () {
        var t = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(function () { btn.textContent = t; }, 1200);
      }).catch(function () { btn.textContent = "Copy failed"; });
    });
    header.appendChild(btn);
  });
});
</script>
